<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨韻閱覽器 | Modern Traditional Chinese eBook Reader</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- JSZip (Required for EPUB.js) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- EPUB.js -->
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fcf8f2',
                            100: '#f6ecdc',
                            500: '#8c6d46',
                            600: '#755836',
                            700: '#5c4329',
                            900: '#2c1e11',
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', '"Songti TC"', '"PMingLiU"', 'serif'],
                        sans: ['"Noto Sans TC"', '"PingFang TC"', '"Microsoft JhengHei"', 'sans-serif'],
                        kai: ['"Kaiti TC"', '"KaiTi"', '"DFKai-SB"', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar & vertical reader optimizations */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.3);
        }

        /* Vertical RL Mode Styling */
        .writing-vertical {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            height: calc(100vh - 230px);
            min-height: 420px;
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
        }
        .writing-vertical p {
            margin-left: 1.25rem;
            margin-right: 0;
            text-indent: 2em;
        }
        .writing-horizontal {
            writing-mode: horizontal-tb;
            overflow-y: auto;
            overflow-x: hidden;
        }
        .writing-horizontal p {
            margin-bottom: 1rem;
            text-indent: 2em;
        }
        
        /* EPUB renderer container override */
        #epub-viewer {
            height: calc(100vh - 230px);
            min-height: 450px;
            position: relative;
        }
        #epub-viewer iframe {
            border: none !important;
        }
    </style>
</head>
<body class="bg-stone-100 text-stone-800 antialiased min-h-screen flex flex-col font-sans select-none">

    <!-- ==================== HEADER / TOOLBAR ==================== -->
    <header class="bg-white/90 backdrop-blur border-b border-stone-200 sticky top-0 z-30 transition-colors duration-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <!-- Brand Logo & Title -->
            <div class="flex items-center gap-3 cursor-pointer" onclick="app.showLibrary()">
                <div class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center shadow-md shadow-brand-600/20">
                    <i data-lucide="book-open" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-stone-900 tracking-wide flex items-center gap-2">
                        墨韻閱覽器
                        <span class="text-xs px-2 py-0.5 rounded-full bg-brand-100 text-brand-700 font-normal">離線版</span>
                    </h1>
                    <p class="text-xs text-stone-500 hidden sm:block">古典與現代典籍閱讀平台</p>
                </div>
            </div>

            <!-- Header Controls (Library Mode) -->
            <div id="library-header-controls" class="flex items-center gap-2 sm:gap-3">
                <!-- Search Bar -->
                <div class="relative hidden md:block w-64">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-stone-400"></i>
                    <input type="text" id="search-input" oninput="app.handleSearch(this.value)" placeholder="搜尋書名或作者..." 
                        class="w-full pl-9 pr-4 py-1.5 text-sm bg-stone-100 border border-stone-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all">
                </div>

                <!-- View Mode Toggle -->
                <div class="flex items-center bg-stone-100 p-1 rounded-lg border border-stone-200">
                    <button onclick="app.setViewMode('grid')" id="btn-view-grid" class="p-1.5 rounded text-stone-600 hover:text-stone-900 transition-colors" title="網格檢視">
                        <i data-lucide="layout-grid" class="w-4 h-4"></i>
                    </button>
                    <button onclick="app.setViewMode('list')" id="btn-view-list" class="p-1.5 rounded text-stone-600 hover:text-stone-900 transition-colors" title="列表檢視">
                        <i data-lucide="list" class="w-4 h-4"></i>
                    </button>
                </div>

                <!-- Batch Selection Toggle -->
                <button onclick="app.toggleBatchMode()" id="btn-batch-toggle" class="px-3 py-1.5 text-sm font-medium text-stone-700 bg-stone-100 hover:bg-stone-200 rounded-lg transition-colors flex items-center gap-1.5">
                    <i data-lucide="check-square" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">批量管理</span>
                </button>

                <!-- Add Book Button -->
                <label class="px-3.5 py-1.5 text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 rounded-lg shadow-sm cursor-pointer transition-colors flex items-center gap-1.5">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>匯入書籍</span>
                    <input type="file" id="file-input" accept=".txt,.epub" multiple class="hidden" onchange="app.handleFileUpload(event)">
                </label>
            </div>

            <!-- Header Controls (Reader Mode) -->
            <div id="reader-header-controls" class="hidden items-center gap-2">
                <button onclick="app.showLibrary()" class="px-3 py-1.5 text-sm font-medium text-stone-700 hover:bg-stone-100 rounded-lg transition-colors flex items-center gap-1.5">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>返回書庫</span>
                </button>

                <div class="h-4 w-px bg-stone-200 mx-1"></div>

                <button onclick="app.toggleWritingMode()" id="btn-writing-mode" class="px-2.5 py-1.5 text-xs font-medium text-stone-700 bg-stone-100 hover:bg-stone-200 rounded-lg transition-colors flex items-center gap-1" title="切換橫/直排">
                    <i data-lucide="repeat" class="w-3.5 h-3.5"></i>
                    <span id="writing-mode-label">橫排</span>
                </button>

                <button onclick="app.toggleDrawer('toc')" class="p-2 text-stone-700 hover:bg-stone-100 rounded-lg transition-colors" title="章節目錄">
                    <i data-lucide="list-tree" class="w-4 h-4"></i>
                </button>

                <button onclick="app.toggleDrawer('settings')" class="p-2 text-stone-700 hover:bg-stone-100 rounded-lg transition-colors" title="閱讀設定">
                    <i data-lucide="sliders" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- ==================== BATCH MANAGEMENT BAR ==================== -->
    <div id="batch-toolbar" class="hidden bg-brand-900 text-white px-4 py-3 border-b border-brand-800 transition-all sticky top-16 z-20">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-sm">已選擇 <strong id="selected-count" class="text-amber-400">0</strong> 本書籍</span>
                <button onclick="app.selectAllBooks()" class="text-xs px-2.5 py-1 bg-brand-700 hover:bg-brand-600 rounded transition-colors">全選</button>
                <button onclick="app.clearBookSelection()" class="text-xs px-2.5 py-1 bg-brand-700 hover:bg-brand-600 rounded transition-colors">取消全選</button>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="app.deleteSelectedBooks()" class="px-3 py-1 text-xs font-medium bg-red-600 hover:bg-red-700 rounded transition-colors flex items-center gap-1">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    <span>刪除選取書籍</span>
                </button>
                <button onclick="app.toggleBatchMode(false)" class="px-3 py-1 text-xs font-medium bg-stone-700 hover:bg-stone-600 rounded transition-colors">完成</button>
            </div>
        </div>
    </div>

    <!-- ==================== MAIN CONTENT AREA ==================== -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 relative">

        <!-- ===== LIBRARY VIEW ===== -->
        <section id="library-view" class="space-y-6">
            <!-- Dropzone Banner -->
            <div id="dropzone" class="border-2 border-dashed border-stone-300 hover:border-brand-500 rounded-2xl p-8 text-center bg-white/50 hover:bg-white/90 transition-all duration-200 cursor-pointer flex flex-col items-center justify-center gap-2 shadow-sm"
                 onclick="document.getElementById('file-input').click()">
                <div class="w-12 h-12 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center">
                    <i data-lucide="upload-cloud" class="w-6 h-6"></i>
                </div>
                <div class="space-y-1">
                    <p class="text-base font-semibold text-stone-700">點擊或將電子書檔案拖曳至此處</p>
                    <p class="text-xs text-stone-400">支援繁體中文 .TXT 與 .EPUB 格式檔案</p>
                </div>
            </div>

            <!-- Book Grid Container -->
            <div id="books-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
                <!-- Rendered Dynamically -->
            </div>

            <!-- Book List Container -->
            <div id="books-list" class="hidden bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-stone-50 border-b border-stone-200 text-xs font-semibold text-stone-500 uppercase tracking-wider">
                            <th class="p-4 w-10 text-center select-checkbox-col hidden">選取</th>
                            <th class="p-4">書名與作者</th>
                            <th class="p-4 w-24">格式</th>
                            <th class="p-4 w-24">大小</th>
                            <th class="p-4 w-36">閱讀進度</th>
                            <th class="p-4 w-24 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="books-list-body" class="divide-y divide-stone-100 text-sm">
                        <!-- Rendered Dynamically -->
                    </tbody>
                </table>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-16 space-y-3">
                <i data-lucide="book-x" class="w-12 h-12 text-stone-300 mx-auto"></i>
                <p class="text-stone-500 font-medium">藏書閣空空如也</p>
                <p class="text-xs text-stone-400">請匯入 .txt 或 .epub 電子書開始閱讀</p>
            </div>
        </section>

        <!-- ===== READER VIEW ===== -->
        <section id="reader-view" class="hidden min-h-[calc(100dvh-130px)] flex-col justify-between">
            <!-- Reader Main Container -->
            <div id="reader-container" class="relative max-w-4xl mx-auto w-full bg-white rounded-2xl shadow-md border border-stone-200/80 p-6 sm:p-10 transition-all duration-200 flex-1 flex flex-col justify-between">
                
                <!-- Book Title Bar in Reader -->
                <div class="flex items-center justify-between pb-4 mb-4 border-b border-stone-200/60 text-xs opacity-70 font-medium shrink-0">
                    <span id="reader-book-title" class="truncate max-w-[250px] sm:max-w-md">書籍名稱</span>
                    <span id="reader-chapter-title" class="truncate max-w-[180px] sm:max-w-xs text-right">目前章節</span>
                </div>

                <!-- Loading / Error Banner inside Reader -->
                <div id="reader-status" class="hidden py-16 text-center space-y-3 my-auto">
                    <div id="reader-spinner" class="w-8 h-8 border-4 border-brand-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <p id="reader-status-text" class="text-sm font-medium opacity-80">正在解析典籍內容...</p>
                </div>

                <!-- TXT Reader Display Area -->
                <div id="txt-viewer" class="writing-horizontal transition-all flex-1">
                    <!-- Text Paragraphs Inserted Here -->
                </div>

                <!-- EPUB Reader Display Area -->
                <div id="epub-viewer" class="hidden w-full flex-1">
                    <!-- EPUB Iframe Embedded Here -->
                </div>

                <!-- Reader Footer Progress Bar -->
                <div class="mt-6 pt-4 border-t border-stone-200/60 flex items-center justify-between text-xs opacity-75 font-medium shrink-0">
                    <button id="btn-prev-chapter" onclick="app.prevChapter()" class="hover:text-brand-600 flex items-center gap-1 transition-colors py-1 px-2 rounded hover:bg-black/5">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i> 上一章
                    </button>
                    <div class="flex items-center gap-2">
                        <span id="reader-progress-percent">0%</span>
                    </div>
                    <button id="btn-next-chapter" onclick="app.nextChapter()" class="hover:text-brand-600 flex items-center gap-1 transition-colors py-1 px-2 rounded hover:bg-black/5">
                        下一章 <i data-lucide="chevron-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- ==================== DRAWER: CHAPTER TOC ==================== -->
    <aside id="drawer-toc" class="fixed inset-y-0 right-0 w-80 max-w-full bg-white shadow-2xl z-40 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-4 border-b border-stone-200 flex items-center justify-between bg-stone-50">
            <h3 class="font-bold text-stone-800 flex items-center gap-2">
                <i data-lucide="list-tree" class="w-4 h-4 text-brand-600"></i>
                章節目錄
            </h3>
            <button onclick="app.toggleDrawer('toc', false)" class="p-1 text-stone-400 hover:text-stone-600 rounded-lg">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <div id="toc-list" class="flex-1 overflow-y-auto p-3 space-y-1 text-sm">
            <!-- Dynamic Chapter Links -->
        </div>
    </aside>

    <!-- ==================== DRAWER: SETTINGS ==================== -->
    <aside id="drawer-settings" class="fixed inset-y-0 right-0 w-80 max-w-full bg-white shadow-2xl z-40 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-4 border-b border-stone-200 flex items-center justify-between bg-stone-50">
            <h3 class="font-bold text-stone-800 flex items-center gap-2">
                <i data-lucide="sliders" class="w-4 h-4 text-brand-600"></i>
                閱讀設定
            </h3>
            <button onclick="app.toggleDrawer('settings', false)" class="p-1 text-stone-400 hover:text-stone-600 rounded-lg">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-5 space-y-6 text-sm">
            <!-- Typography Preset -->
            <div class="space-y-2">
                <label class="font-semibold text-stone-700 block text-xs tracking-wider uppercase">字體選擇</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="app.setFontFamily('serif')" id="btn-font-serif" class="py-2 px-3 border border-stone-200 rounded-lg font-serif text-center hover:border-brand-500">明體</button>
                    <button onclick="app.setFontFamily('sans')" id="btn-font-sans" class="py-2 px-3 border border-stone-200 rounded-lg font-sans text-center hover:border-brand-500">黑體</button>
                    <button onclick="app.setFontFamily('kai')" id="btn-font-kai" class="py-2 px-3 border border-stone-200 rounded-lg font-kai text-center hover:border-brand-500">楷體</button>
                </div>
            </div>

            <!-- Font Size -->
            <div class="space-y-2">
                <div class="flex justify-between text-xs font-semibold text-stone-700">
                    <span>字體大小</span>
                    <span id="font-size-val">18px</span>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="app.changeFontSize(-1)" class="p-2 border border-stone-200 rounded-lg hover:bg-stone-50"><i data-lucide="minus" class="w-4 h-4"></i></button>
                    <input type="range" min="12" max="36" step="1" id="input-font-size" oninput="app.setFontSize(this.value)" class="w-full accent-brand-600">
                    <button onclick="app.changeFontSize(1)" class="p-2 border border-stone-200 rounded-lg hover:bg-stone-50"><i data-lucide="plus" class="w-4 h-4"></i></button>
                </div>
            </div>

            <!-- Line Spacing -->
            <div class="space-y-2">
                <label class="font-semibold text-stone-700 block text-xs tracking-wider uppercase">行距調整</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="app.setLineHeight('1.6')" class="py-1.5 border border-stone-200 rounded-lg text-xs hover:border-brand-500">緊密</button>
                    <button onclick="app.setLineHeight('1.9')" class="py-1.5 border border-stone-200 rounded-lg text-xs hover:border-brand-500">標準</button>
                    <button onclick="app.setLineHeight('2.3')" class="py-1.5 border border-stone-200 rounded-lg text-xs hover:border-brand-500">寬鬆</button>
                </div>
            </div>

            <!-- Color Themes -->
            <div class="space-y-2">
                <label class="font-semibold text-stone-700 block text-xs tracking-wider uppercase">閱讀主題</label>
                <div class="grid grid-cols-2 gap-2.5">
                    <button onclick="app.setTheme('warm')" class="p-3 rounded-lg border border-stone-200 flex items-center justify-between bg-[#FBF8F1] text-[#332C23]">
                        <span class="text-xs font-medium">暖金白</span>
                        <span class="w-4 h-4 rounded-full border border-stone-300 bg-[#FBF8F1]"></span>
                    </button>
                    <button onclick="app.setTheme('parchment')" class="p-3 rounded-lg border border-stone-200 flex items-center justify-between bg-[#F4EAD5] text-[#4A3E2C]">
                        <span class="text-xs font-medium">羊皮紙</span>
                        <span class="w-4 h-4 rounded-full border border-stone-300 bg-[#F4EAD5]"></span>
                    </button>
                    <button onclick="app.setTheme('emerald')" class="p-3 rounded-lg border border-stone-200 flex items-center justify-between bg-[#E8F3E8] text-[#1C3B2B]">
                        <span class="text-xs font-medium">竹青綠</span>
                        <span class="w-4 h-4 rounded-full border border-stone-300 bg-[#E8F3E8]"></span>
                    </button>
                    <button onclick="app.setTheme('slate')" class="p-3 rounded-lg border border-stone-200 flex items-center justify-between bg-[#24292E] text-[#E1E4E8]">
                        <span class="text-xs font-medium">曜石金</span>
                        <span class="w-4 h-4 rounded-full border border-stone-300 bg-[#24292E]"></span>
                    </button>
                    <button onclick="app.setTheme('night')" class="p-3 rounded-lg border border-stone-200 flex items-center justify-between bg-[#121212] text-[#A0A0A0]">
                        <span class="text-xs font-medium">極夜黑</span>
                        <span class="w-4 h-4 rounded-full border border-stone-300 bg-[#121212]"></span>
                    </button>
                </div>
            </div>

            <!-- Custom Color Palette -->
            <div class="space-y-3 pt-2 border-t border-stone-200">
                <label class="font-semibold text-stone-700 block text-xs tracking-wider uppercase">自訂顏色</label>
                <div class="flex items-center justify-between">
                    <span class="text-xs text-stone-600">背景顏色</span>
                    <input type="color" id="picker-bg" onchange="app.setCustomBg(this.value)" class="w-8 h-8 rounded border-none cursor-pointer">
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-xs text-stone-600">文字顏色</span>
                    <input type="color" id="picker-text" onchange="app.setCustomText(this.value)" class="w-8 h-8 rounded border-none cursor-pointer">
                </div>
            </div>
        </div>
    </aside>

    <!-- Overlay backdrop for drawers -->
    <div id="drawer-backdrop" onclick="app.toggleDrawer(null, false)" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-30 hidden transition-opacity"></div>

    <!-- ==================== CONFIRMATION MODAL ==================== -->
    <div id="confirm-modal" class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4">
            <h3 class="text-lg font-bold text-stone-900" id="modal-title">確定要刪除嗎？</h3>
            <p class="text-sm text-stone-600" id="modal-desc">此動作無法撤銷，書籍資料將從本機數據庫中永久移除。</p>
            <div class="flex justify-end gap-3 pt-2">
                <button onclick="app.closeModal()" class="px-4 py-2 text-sm font-medium text-stone-600 bg-stone-100 hover:bg-stone-200 rounded-lg transition-colors">取消</button>
                <button id="modal-confirm-btn" class="px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors">確認刪除</button>
            </div>
        </div>
    </div>

    <!-- ==================== APPLICATION SCRIPT ==================== -->
    <script>
        // Sample Built-in Classic Literature Book: 《三國演義》前三回
        const SAMPLE_BOOK_TEXT = `《三國演義》
作者：羅貫中

第一回 宴桃園豪傑三結義 斬黃巾英雄首立功

滾滾長江東逝水，浪花淘盡英雄。是非成敗轉頭空。青山依舊在，幾度夕陽紅。
白髮漁樵江渚上，慣看秋月春風。一壺濁酒喜相逢。古今多少事，都付笑談中。
-- 調寄《臨江仙》

話說天下大勢，分久必合，合久必分。周末七國分爭，併入於秦。秦滅之後，楚、漢分爭，又併入於漢。漢朝自高祖斬白蛇而起義，一統天下，後來光武中興，傳至獻帝，遂分為三國。推其致亂之由，殆始於桓、靈二帝。桓帝禁錮善類，崇信宦官。及桓帝崩，靈帝即位，大將軍竇武、太傅陳蕃共相輔佐。時有宦官曹節等弄權，竇武、陳蕃謀誅之，機事不密，反為所害，中涓自此愈橫。

建寧二年四月望日，帝御溫德殿。方升座，殿角狂風驟起。只見一條大青蛇，從梁上飛將下來，蟠於椅上。帝驚倒，左右急救入宮，百官俱奔避。須臾，蛇不見了。忽然大雨，雹下到半夜，方止，壞卻房屋無數。建寧四年二年二月，洛陽地震；又海水溢溢，沿海居民，盡被大浪卷入海中。光和元年，雌雞化雄。六月朔，黑氣十餘丈，飛入溫德殿中。秋七月，有虹見於玉堂；五色紐草，見於金階。侍中蔡邕上疏，以為霓墜雞化，乃婦寺干政之所致，言甚切直。帝覽奏歎息，因起更衣。曹節在後竊視，悉宣告左右；遂以他事陷邕，放歸田里。後張角、張寶、張梁三兄弟作亂，號為「黃巾賊」。

時巨鹿郡有兄弟三人，一名張角，一名張寶，一名張梁。那張角本是個不第秀才，因入山採藥，遇一老人，碧眼童顏，手執藜杖，喚角至一洞中，授書三卷，曰：「此《太平要術》也。汝得之，當代天宣化，普救世人；若萌異心，必獲惡報。」角拜受此書，旦夕攻習，能呼風喚雨，號為「太平道人」。

第二回 張翼德怒鞭督郵 何國舅謀誅宦官

且說張飛嚐酒大醉，手提鋼鞭，騎上馬，引數騎至館驛，逕入後堂。見一老人跪於地哭訴。飛問何故。老人曰：「吾乃本縣典吏。督郵威逼縣尉，欲害劉公；吾等勸阻，督郵反痛毆我等。」張飛大怒，睜圓環眼，咬碎鋼牙，跳下馬，徑入後堂，把督郵提將出來，一路拖到縣衙前，縛在馬樁上，折下柳條，往督郵兩腿上狠霸霸的抽打，連打折柳條數十根。

玄德正愁悶間，聽得衙前喧噪，急問左右，曰：「張將軍提得一人在衙前痛打。」玄德驚忙出視，見縛者乃督郵也。玄德大驚，問其故。飛曰：「此賊害民，不打死等甚！」督郵告曰：「玄德公救我性命！」玄德終是仁慈之人，急喝張飛住手。關公從旁便道：「兄長施大功，僅得一縣尉，今反被督郵侮辱。吾思黃巾勢大，天下將亂，不如殺此賊，棄官歸鄉，另作長策。」玄德乃印綬掛於督郵之頸，責之曰：「據汝害民，本當殺汝；今姑饒汝命，吾繳還印綬，自此去矣！」

第三回 議溫明董卓叱丁原 鴆白帝李儒殺弘農

卻說董卓字仲穎，隴西臨洮人也，官至西涼刺史，統兵二十萬，每有驕志。是日召集百官宴飲，卓厲聲曰：「天子為萬民之主，無威儀不可奉宗廟。今帝懦弱，不若弘農王；吾欲廢帝，立陳留王，諸大臣以為何如？」百官噤佩不敢出聲。

座下一人推案而出，大叫曰：「不可！不可！汝何人，敢發大言？天子乃先帝嫡子，初無過失，何得妄議廢立！汝欲為篡逆邪？」卓視之，乃荊州刺史丁原也。卓大怒曰：「順我者生，逆我者死！」拔佩劍欲斬原。時丁原背後站立一人，生得器宇軒昂，威風凜凜，手執方天畫戟，怒目而視。乃包頭呂布也！`;

            // IndexedDB Initialization
            initIndexedDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('TC_EBook_Reader_DB', 1);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('books')) {
                            db.createObjectStore('books', { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve();
                    };
                    request.onerror = (e) => reject('Database error: ' + e.target.errorCode);
                });
            }

            // Seed Built-in Literature Sample

                const sampleBlob = new Blob([SAMPLE_BOOK_TEXT], { type: 'text/plain;charset=utf-8' });
                const sampleBook = {
                    id: 'sample-001',
                    title: '《三國演義》（經典選章）',
                    author: '羅貫中',
                    format: 'txt',
                    size: sampleBlob.size,
                    importDate: new Date().toISOString(),
                    fileData: await sampleBlob.arrayBuffer(),
                    lastPosition: 0,
                    currentChapterIndex: 0
                };
                await this.saveBookToDB(sampleBook);

            // CRUD DB Operations
            saveBookToDB(book) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('books', 'readwrite');
                    const store = tx.objectStore('books');
                    store.put(book);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }

            loadBooks() {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('books', 'readonly');
                    const store = tx.objectStore('books');
                    const request = store.getAll();
                    request.onsuccess = () => {
                        this.books = request.result || [];
                        resolve();
                    };
                    request.onerror = () => reject(request.error);
                });
            }

            deleteBookFromDB(id) {
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('books', 'readwrite');
                    const store = tx.objectStore('books');
                    store.delete(id);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
            }

            // Drag and Drop File Handling
            setupDragAndDrop() {
                const dropzone = document.getElementById('dropzone');
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    dropzone.addEventListener(eventName, (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                    }, false);
                });
                dropzone.addEventListener('drop', (e) => {
                    const files = e.dataTransfer.files;
                    if (files.length) this.processFiles(files);
                });
            }

            handleFileUpload(event) {
                const files = event.target.files;
                if (files.length) this.processFiles(files);
            }

            async processFiles(files) {
                for (let file of files) {
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (ext !== 'txt' && ext !== 'epub') continue;

                    const arrayBuffer = await file.arrayBuffer();
                    const title = file.name.replace(/\.[^/.]+$/, "");
                    
                    const newBook = {
                        id: 'book_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                        title: title,
                        author: ext === 'epub' ? 'EPUB 電子書' : '未知作者',
                        format: ext,
                        size: file.size,
                        importDate: new Date().toISOString(),
                        fileData: arrayBuffer,
                        lastPosition: 0,
                        currentChapterIndex: 0
                    };

                    await this.saveBookToDB(newBook);
                }
                await this.loadBooks();
                this.renderLibrary();

                if (mode === 'grid') {

                this.isBatchMode = enable;
                this.selectedBookIds.clear();
                document.getElementById('batch-toolbar').classList.toggle('hidden', !enable);
                
                // Show/hide select checkboxes in list view

                    el.classList.toggle('hidden', !enable);

                this.updateBatchCountUI();
                this.renderLibrary();

            handleBookClick(id, event) {
                if (this.isBatchMode) {
                    if (this.selectedBookIds.has(id)) {
                        this.selectedBookIds.delete(id);
                    } else {
                        this.selectedBookIds.add(id);
                    }
                    this.updateBatchCountUI();
                    this.renderLibrary();
                } else {
                    this.openBook(id);
                }
            }

            selectAllBooks() {
                this.books.forEach(b => this.selectedBookIds.add(b.id));

                this.renderLibrary();

                    this.renderLibrary();

                }
                lucide.createIcons();
            }

            showLibrary() {
                if (this.epubRendition) {
                    try { this.epubRendition.destroy(); } catch (e) {}
                    this.epubRendition = null;
                }
                this.epubBook = null;
                window.onscroll = null;

                const libraryView = document.getElementById('library-view');
                const readerView = document.getElementById('reader-view');
                const libControls = document.getElementById('library-header-controls');
                const readerControls = document.getElementById('reader-header-controls');

                readerView.classList.add('hidden');
                readerView.classList.remove('flex');
                libraryView.classList.remove('hidden');

                readerControls.classList.add('hidden');
                readerControls.classList.remove('flex');
                libControls.classList.remove('hidden');
                libControls.classList.add('flex');
            }

            setReaderStatus(show, text = '正在解析典籍內容...', isError = false) {
                const statusEl = document.getElementById('reader-status');
                const spinnerEl = document.getElementById('reader-spinner');
                const textEl = document.getElementById('reader-status-text');
                if (!show) {
                    statusEl.classList.add('hidden');
                    return;
                }
                statusEl.classList.remove('hidden');
                spinnerEl.classList.toggle('hidden', isError);
                textEl.innerText = text;
                textEl.className = isError ? 'text-sm font-medium text-red-600' : 'text-sm font-medium opacity-80';
            }

            // Detect UTF-8 / Big5 / GBK text encodings automatically
            decodeTextBuffer(buffer) {
                const bytes = new Uint8Array(buffer);
                try {
                    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
                } catch (e) {
                    try {
                        return new TextDecoder('big5', { fatal: true }).decode(bytes);
                    } catch (e2) {
                        try {
                            return new TextDecoder('gb18030').decode(bytes);
                        } catch (e3) {
                            return new TextDecoder('utf-8').decode(bytes);
                        }
                    }
                }
            }

            // TXT Chapter Parsing & Formatting
            async renderTXTBook() {
                try {
                    const textContent = this.decodeTextBuffer(this.currentBook.fileData);

                    // Traditional Chinese Chapter Pattern Regex
                    const chapterRegex = /(第[0-9一二三四五六七八九十百千萬]+[章回卷節部][^\n]*)/g;
                    const splitContent = textContent.split(chapterRegex);

                    this.chapters = [];
                    let currentTitle = "卷首 / 開始閱讀";
                    let currentBody = "";

                    if (splitContent.length <= 1) {
                        this.chapters.push({ title: currentTitle, text: textContent });
                    } else {
                        for (let i = 0; i < splitContent.length; i++) {
                            const chunk = splitContent[i].trim();
                            if (!chunk) continue;
                            if (/^第[0-9一二三四五六七八九十百千萬]+[章回卷節部]/.test(chunk)) {
                                if (currentBody.trim()) {
                                    this.chapters.push({ title: currentTitle, text: currentBody });
                                    currentBody = "";
                                }
                                currentTitle = chunk;
                            } else {
                                currentBody += chunk + "\n";
                            }
                        }
                        if (currentBody.trim()) {
                            this.chapters.push({ title: currentTitle, text: currentBody });
                        }
                    }

                    if (this.chapters.length === 0) {
                        this.chapters.push({ title: "全文", text: textContent || "（此檔案無文字內容）" });
                    }

                    this.currentChapterIndex = Math.min(this.currentBook.currentChapterIndex || 0, this.chapters.length - 1);
                    this.renderTOC(false);
                    this.loadTXTChapter(this.currentChapterIndex, true);
                    this.setupScrollProgressTracker();
                } catch (err) {
                    console.error('TXT Render Error:', err);
                    this.setReaderStatus(true, 'TXT 檔案解析失敗，請確認檔案格式是否正確。', true);
                }
            }

            escapeHTML(str) {
                return str
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;');
            }

            loadTXTChapter(index, restoreScroll = false) {
                if (index < 0 || index >= this.chapters.length) return;
                this.currentChapterIndex = index;
                this.currentBook.currentChapterIndex = index;
                
                const chapter = this.chapters[index];
                document.getElementById('reader-chapter-title').innerText = chapter.title;

                const txtViewer = document.getElementById('txt-viewer');
                
                // Format paragraphs into <p> tags with proper indentation
                const paragraphs = chapter.text
                    .split(/\r?\n/)
                    .map(line => line.trim())
                    .filter(line => line.length > 0)
                    .map(line => `<p>${this.escapeHTML(line)}</p>`)
                    .join('');

                txtViewer.innerHTML = `<h2 id="chap-${index}" class="text-xl font-bold mb-6 border-b border-current/20 pb-3">${this.escapeHTML(chapter.title)}</h2>` + paragraphs;
                
                if (restoreScroll && typeof this.currentBook.lastPosition === 'number' && this.currentBook.lastPosition > 0) {
                    requestAnimationFrame(() => {
                        const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
                        if (totalHeight > 0) {
                            window.scrollTo({ top: (this.currentBook.lastPosition / 100) * totalHeight, behavior: 'instant' });
                        }
                        document.getElementById('reader-progress-percent').innerText = `${this.currentBook.lastPosition}%`;
                    });
                } else {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    txtViewer.scrollLeft = 0;
                    const basePercent = Math.round(((index + 1) / this.chapters.length) * 100);
                    document.getElementById('reader-progress-percent').innerText = this.chapters.length > 1 ? `第 ${index + 1}/${this.chapters.length} 章` : '0%';
                    this.currentBook.lastPosition = 0;
                }

                this.saveReadingProgress();
                this.updateActiveTOC();
            }

            // EPUB Renderer via EPUB.js
            async renderEPUBBook() {
                const container = document.getElementById('epub-viewer');
                container.innerHTML = '';
                this.setReaderStatus(true, '正在解析 EPUB 電子書，請稍候...');

                try {
                    if (typeof ePub === 'undefined') {
                        throw new Error('EPUB.js 引擎尚未載入完成');
                    }

                    // Clone ArrayBuffer so EPUB.js worker/JSZip doesn't detach the stored buffer
                    const bufferCopy = this.currentBook.fileData.slice(0);
                    this.epubBook = ePub(bufferCopy);
                    await this.epubBook.ready;

                    this.epubRendition = this.epubBook.renderTo('epub-viewer', {
                        width: '100%',
                        height: '100%',
                        flow: 'scrolled-doc',
                        manager: 'continuous'
                    });

                    this.applyEpubTheme();

                    const savedCfi = typeof this.currentBook.lastPosition === 'string' ? this.currentBook.lastPosition : undefined;
                    try {
                        await this.epubRendition.display(savedCfi);
                    } catch (dispErr) {
                        // Fallback if saved CFI is invalid or scrolled-doc had an issue
                        await this.epubRendition.display();
                    }

                    this.setReaderStatus(false);

                    // TOC Navigation parsing for EPUB
                    const navigation = await this.epubBook.loaded.navigation;
                    const flattenToc = (items) => {
                        let result = [];
                        for (const item of items) {
                            result.push({ title: item.label.trim(), href: item.href });
                            if (item.subitems && item.subitems.length) {
                                result = result.concat(flattenToc(item.subitems));
                            }
                        }
                        return result;
                    };
                    this.chapters = navigation && navigation.toc ? flattenToc(navigation.toc) : [];
                    this.renderTOC(true);

                    if (this.chapters.length > 0) {
                        document.getElementById('reader-chapter-title').innerText = this.chapters[0].title;
                    } else {
                        document.getElementById('reader-chapter-title').innerText = '正文';
                    }

                    this.epubRendition.on('relocated', (location) => {
                        if (location && location.start) {
                            this.currentBook.lastPosition = location.start.cfi;
                            const percent = typeof location.start.percentage === 'number'
                                ? Math.round(location.start.percentage * 100)
                                : 0;
                            document.getElementById('reader-progress-percent').innerText = `${percent}%`;
                            this.saveBookToDB(this.currentBook);
                        }
                    });
                } catch (err) {
                    console.error('EPUB Render Error:', err);
                    container.classList.add('hidden');
                    this.setReaderStatus(true, '無法開啟此 EPUB 檔案，檔案可能已損毀或格式不相容。', true);
                }
            }

            applyEpubTheme() {
                if (!this.epubRendition) return;
                const fontMap = {
                    serif: '"Noto Serif TC", "Songti TC", "PMingLiU", serif',
                    sans: '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif',
                    kai: '"Kaiti TC", "KaiTi", "DFKai-SB", serif'
                };
                const isVertical = this.settings.writingMode === 'vertical';
                this.epubRendition.themes.default({
                    'html, body': {
                        'background-color': `${this.settings.customBg} !important`,
                        'color': `${this.settings.customText} !important`,
                        'font-family': `${fontMap[this.settings.fontFamily]} !important`,
                        'font-size': `${this.settings.fontSize}px !important`,
                        'line-height': `${this.settings.lineHeight} !important`,
                        'writing-mode': isVertical ? 'vertical-rl !important' : 'horizontal-tb !important',
                        'padding': '12px 16px !important'
                    },
                    'p, div, span, li, h1, h2, h3, h4': {
                        'color': `${this.settings.customText} !important`,
                        'font-family': `${fontMap[this.settings.fontFamily]} !important`,
                        'line-height': `${this.settings.lineHeight} !important`
                    }
                });
            }

            // Populate Chapter Drawer TOC
            renderTOC(isEpub = false) {
                const tocList = document.getElementById('toc-list');
                if (!this.chapters.length) {
                    tocList.innerHTML = `<p class="text-xs text-stone-400 text-center py-8">本書無可用章節目錄</p>`;
                    return;
                }
                tocList.innerHTML = this.chapters.map((ch, idx) => `
                    <button onclick="${isEpub ? `app.jumpEpubChapter('${ch.href.replace(/'/g, "\\'")}')` : `app.loadTXTChapter(${idx}); app.toggleDrawer('toc', false);`}" 
                            class="w-full text-left px-3 py-2 rounded-lg hover:bg-stone-100 transition-colors truncate text-stone-700 flex items-center justify-between group">
                        <span class="truncate">${this.escapeHTML(ch.title)}</span>
                        <i data-lucide="chevron-right" class="w-3.5 h-3.5 opacity-0 group-hover:opacity-100 text-stone-400 shrink-0"></i>
                    </button>
                `).join('');
                lucide.createIcons();
            }
            }

            nextChapter() {
                if (this.currentBook.format === 'epub' && this.epubRendition) {
                    this.epubRendition.next();
                } else if (this.currentChapterIndex < this.chapters.length - 1) {
                    this.loadTXTChapter(this.currentChapterIndex + 1);
                }
            }

            // Scroll Progress Persistence
            setupScrollProgressTracker() {
                window.onscroll = () => {
                    clearTimeout(this.scrollDebounceTimer);
                    this.scrollDebounceTimer = setTimeout(() => {
                        const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
                        if (totalHeight <= 0) return;
                        const scrollPercent = Math.min(100, Math.max(0, Math.round((window.scrollY / totalHeight) * 100)));
                        document.getElementById('reader-progress-percent').innerText = `${scrollPercent}%`;
                        this.currentBook.lastPosition = scrollPercent;
                        this.saveReadingProgress();
                    }, 200);
                };
            }

            saveReadingProgress() {
                if (this.currentBook) {
                    this.saveBookToDB(this.currentBook);
                }
            }

            // Customization Drawer Controls
            toggleDrawer(type, show = true) {
                const tocDrawer = document.getElementById('drawer-toc');
                const settingsDrawer = document.getElementById('drawer-settings');
                const backdrop = document.getElementById('drawer-backdrop');

                tocDrawer.classList.add('translate-x-full');
                settingsDrawer.classList.add('translate-x-full');

                if (show && type === 'toc') {
                    tocDrawer.classList.remove('translate-x-full');
                    backdrop.classList.remove('hidden');
                } else if (show && type === 'settings') {
                    settingsDrawer.classList.remove('translate-x-full');
                    backdrop.classList.remove('hidden');
                } else {
                    backdrop.classList.add('hidden');
                }
            }

            // Customization Options
            setFontSize(size) {
                this.settings.fontSize = size;
                document.getElementById('font-size-val').innerText = `${size}px`;
                document.getElementById('input-font-size').value = size;
                this.applyReaderSettings();
            }

            changeFontSize(delta) {
                const newSize = Math.min(36, Math.max(12, parseInt(this.settings.fontSize) + delta));
                this.setFontSize(newSize);
            }

            setFontFamily(family) {
                this.settings.fontFamily = family;
                this.applyReaderSettings();
            }

            setLineHeight(height) {
                this.settings.lineHeight = height;
                this.applyReaderSettings();
            }

            toggleWritingMode() {
                this.settings.writingMode = this.settings.writingMode === 'horizontal' ? 'vertical' : 'horizontal';
                this.applyReaderSettings();
            }

            setTheme(themeName) {
                this.settings.theme = themeName;
                const presets = {
                    warm: { bg: '#FBF8F1', text: '#332C23' },
                    parchment: { bg: '#F4EAD5', text: '#4A3E2C' },
                    emerald: { bg: '#E8F3E8', text: '#1C3B2B' },
                    slate: { bg: '#24292E', text: '#E1E4E8' },
                    night: { bg: '#121212', text: '#A0A0A0' }
                };
                if (presets[themeName]) {
                    this.settings.customBg = presets[themeName].bg;
                    this.settings.customText = presets[themeName].text;
                }
                this.applyReaderSettings();
            }

            setCustomBg(color) {
                this.settings.customBg = color;
                this.applyReaderSettings();
            }

            setCustomText(color) {
                this.settings.customText = color;
                this.applyReaderSettings();
            }

            applyReaderSettings() {
                const txtViewer = document.getElementById('txt-viewer');
                const readerContainer = document.getElementById('reader-container');
                const modeLabel = document.getElementById('writing-mode-label');

                // Font Family Application
                txtViewer.classList.remove('font-serif', 'font-sans', 'font-kai');
                txtViewer.classList.add(`font-${this.settings.fontFamily}`);

                // Font Size & Line Height
                txtViewer.style.fontSize = `${this.settings.fontSize}px`;
                txtViewer.style.lineHeight = this.settings.lineHeight;

                // Orientation Flow (橫排 vs 直排 RL)
                if (this.settings.writingMode === 'vertical') {
                    txtViewer.classList.remove('writing-horizontal');
                    txtViewer.classList.add('writing-vertical');
                    if (modeLabel) modeLabel.innerText = '直排';
                } else {
                    txtViewer.classList.remove('writing-vertical');
                    txtViewer.classList.add('writing-horizontal');
                    if (modeLabel) modeLabel.innerText = '橫排';
                }

                // Theme Colors
                readerContainer.style.backgroundColor = this.settings.customBg;
                readerContainer.style.color = this.settings.customText;

                document.getElementById('picker-bg').value = this.settings.customBg;
                document.getElementById('picker-text').value = this.settings.customText;

                // Sync theme & typography to active EPUB rendition if open
                this.applyEpubTheme();
            }
        }

        // Initialize application on DOM content loaded
        let app;
        window.addEventListener('DOMContentLoaded', () => {
            app = new ReaderApp();
            app.init();
        });
    </script>
</body>
